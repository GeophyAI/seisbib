site_name: seisbib
site_description: A curated, machine-checked bibliography of seismic / seismology papers — from acquisition and processing to imaging, FWI, interpretation, microseismic, and earthquake studies.
site_url: https://geophyai.github.io/seisbib/
repo_url: https://github.com/GeophyAI/seisbib
repo_name: GeophyAI/seisbib
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

nav:
  - Home: index.md
  - Filter: filter.md
  - Recent: recent.md
  - By topic: by-topic/index.md
  - By year: by-year/index.md
  - By journal: by-journal/index.md
  - SEG abstracts: seg/index.md
  - EAGE abstracts: eage/index.md
  - Taxonomy: taxonomy.md
  - Contributing: contributing.md

not_in_nav: |
  /by-topic/*.md
  /by-year/*.md
  /by-journal/*.md
  /seg/**
  /eage/**

extra_javascript:
  - seisbib-copy.js
  - assets/extra.js

extra_css:
  - seisbib-copy.css
  - assets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeophyAI/seisbib
