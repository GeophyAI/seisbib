name: validate

on:
  pull_request:
    paths:
      - 'bib/**'
      - 'TAXONOMY.md'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'bib/**'
      - 'TAXONOMY.md'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run validator
        run: python scripts/validate.py
